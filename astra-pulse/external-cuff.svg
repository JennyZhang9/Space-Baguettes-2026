<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-labelledby="title desc"><title id="title">External upper-arm cuff with a separate blood-pressure monitor</title><desc id="desc">An arrow points to the fabric cuff around an arm. A tube connects it to a separate monitor. The screen shows an illustrative example, not a live measurement.</desc><defs><linearGradient id="arm" x2="0" y2="1"><stop stop-color="#eedcc7"/><stop offset="1" stop-color="#d6b99c"/></linearGradient><linearGradient id="fabric" x2="1" y2="1"><stop stop-color="#8aa8aa"/><stop offset="1" stop-color="#547b80"/></linearGradient><linearGradient id="case" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e7eee8"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#658473"/></marker></defs><ellipse cx="204" cy="147" rx="134" ry="9" fill="#354d3910"/><ellipse cx="454" cy="148" rx="69" ry="7" fill="#354d3910"/><rect x="71" y="64" width="255" height="75" rx="37" fill="url(#arm)" stroke="#cfb698"/><path d="M179 57q43-12 84 0v88q-42 9-84-1Z" fill="url(#fabric)" stroke="#54757b" stroke-width="2"/><path d="M189 59v83m62-83v83" stroke="#c0d3ce" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/><path d="M192 102h53" stroke="#405f65" stroke-width="15"/><path d="M204 95v14" stroke="#91afad" stroke-width="2"/><rect x="226" y="71" width="19" height="11" rx="3" fill="#dce7de"/><path d="M262 126C315 172 365 160 393 122" fill="none" stroke="#849d93" stroke-width="5" stroke-linecap="round"/><path d="M262 126C315 172 365 160 393 122" fill="none" stroke="#a6bcb0" stroke-width="1.5"/><rect x="385" y="42" width="133" height="104" rx="23" fill="url(#case)" stroke="#baccc0" stroke-width="2"/><rect x="399" y="56" width="105" height="60" rx="12" fill="#dce8d9" stroke="#c3d4c0"/><text x="414" y="72" fill="#68816d" font-family="Arial,sans-serif" font-size="8" letter-spacing="1">BLOOD PRESSURE</text><text